name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  game-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm test

  # The multiplayer tests connect without a session, which the Worker now rejects,
  # so CI only type-checks and bundles the Worker until they are updated.
  worker-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare-multiplayer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run check
