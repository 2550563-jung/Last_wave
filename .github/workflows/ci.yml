name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  game-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: node tests/cdn-integrity.mjs

  multiplayer-tests:
    runs-on: ubuntu-latest
    env:
      LW_CLOUDFLARE_TEST_URL: http://127.0.0.1:8787
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Check Worker build
        working-directory: cloudflare-multiplayer
        run: |
          npm ci --no-audit --no-fund
          npm run check
      - name: Start mock Supabase and local Worker
        run: |
          node tests/mock-supabase.mjs &
          cd cloudflare-multiplayer
          npx wrangler dev --local --port 8787 --var SUPABASE_URL:http://127.0.0.1:54399 > wrangler.log 2>&1 &
          for attempt in $(seq 1 60); do
            curl -s -o /dev/null http://127.0.0.1:8787/health && exit 0
            sleep 1
          done
          cat wrangler.log
          exit 1
      - run: node tests/run.mjs
